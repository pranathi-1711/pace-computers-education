
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Pace Computers Education</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #18233b;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px #18233b18;
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    .subtitle { color: #68738a; margin-bottom: 26px; }
    label { display: block; margin: 17px 0 7px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5dbea;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #9bb7ff; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2458d3;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .message { margin-top: 16px; font-size: 14px; line-height: 1.5; }
    .links { margin-top: 22px; text-align: center; line-height: 2; }
    a { color: #2458d3; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Student Login</h1>
    <p class="subtitle">Pace Computers Education</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="loginButton" type="submit">Sign In</button>
      <p id="message" class="message" role="status"></p>
    </form>

    <div class="links">
      <a href="student-register.html">Create student account</a><br>
      <a href="index.html">Back to Home</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://auorbiuxztgpuasfqzlw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_InQQGNuZArb3c11_xEa_Ag_Sr_yJPGB";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;
        if (!data.session) throw new Error("Login session was not created.");

        window.location.href = "pace-student-dashboard.html";
      } catch (error) {
        message.textContent =
          error.message || "Unable to sign in. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Pace Computers Education</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f1f5fb;
            color: #1c2940;
        }

        .register-container {
            max-width: 480px;
            margin: 20px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(20, 45, 90, 0.1);
        }

        .brand {
            text-align: center;
            color: #193b85;
            font-size: 23px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #68738a;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e3;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: 2px solid #b6caff;
            border-color: #2458d3;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #193b85;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #registerMessage {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #registerMessage.visible {
            display: block;
        }

        #registerMessage.success {
            color: #155724;
            background: #e8f5e9;
        }

        #registerMessage.error {
            color: #842029;
            background: #f8d7da;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2458d3;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 23px 19px;
            }
        }
    </style>
</head>

<body>
    <main class="register-container">
        <div class="brand">Pace Computers Education</div>

        <h1>Student Registration</h1>

        <p class="subtitle">Join Pace Computers Education</p>

        <form id="paceRegisterForm">
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
            >

            <label for="course">Select Course</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>
                <option value="Advanced Python">Advanced Python</option>
                <option value="C Language">C Language</option>
                <option value="DCA">DCA</option>
                <option value="HTML">HTML</option>
                <option value="Python">Python</option>
                <option value="SQL">SQL</option>
                <option value="Tally">Tally</option>
            </select>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Enter your password again"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit" id="registerButton">
                Create Student Account
            </button>
        </form>

        <div id="registerMessage" role="status" aria-live="polite"></div>

        <p class="login-link">
            Already registered?
            <a href="pace-student-login.html">Student Login</a>
        </p>
    </main>

    <script type="module">
        import { createClient } from
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL =
            "https://auorbiuxztgpuasfqzlw.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_InQQGNuZArb3c11_xEa_Ag_Sr_yJPGB";

        const paceStudentDb = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const paceRegisterForm =
            document.getElementById("paceRegisterForm");

        const paceRegisterButton =
            document.getElementById("registerButton");

        const registerMessage =
            document.getElementById("registerMessage");

        function showPaceRegisterMessage(message, isError = false) {
            registerMessage.textContent = message;
            registerMessage.className =
                "visible " + (isError ? "error" : "success");
        }

        paceRegisterForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const course =
                document.getElementById("course").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                showPaceRegisterMessage(
                    "Passwords do not match. Please check them.",
                    true
                );
                return;
            }

            if (password.length < 8) {
                showPaceRegisterMessage(
                    "Your password must contain at least 8 characters.",
                    true
                );
                return;
            }

            if (!course) {
                showPaceRegisterMessage(
                    "Please select a course.",
                    true
                );
                return;
            }

            paceRegisterButton.disabled = true;
            paceRegisterButton.textContent = "Creating Account...";

            try {
                const { data, error } =
                    await paceStudentDb.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                full_name: fullName,
                                phone: phone,
                                requested_course: course
                            }
                        }
                    });

                if (error) {
                    throw error;
                }

                if (!data.user) {
                    showPaceRegisterMessage(
                        "Supabase did not return an account. Please try again.",
                        true
                    );
                    return;
                }

                if (data.session) {
                    showPaceRegisterMessage(
                        "Your account was created successfully. Your student profile is handled by the database trigger. Your registration is awaiting administrator approval."
                    );
                } else {
                    showPaceRegisterMessage(
                        "Your account was created. Email confirmation may be required before you can sign in. If no confirmation email arrives, contact the administrator."
                    );
                }

                paceRegisterForm.reset();

            } catch (error) {
                console.error("Registration error:", error);

                showPaceRegisterMessage(
                    error.message ||
                    "Registration failed. Please try again.",
                    true
                );
            } finally {
                paceRegisterButton.disabled = false;
                paceRegisterButton.textContent =
                    "Create Student Account";
            }
        });
    </script>
</body>
</html>
